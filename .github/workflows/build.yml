name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: TurboBeeVPN-iOS
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false

      - name: Build Libbox.xcframework
        run: bash scripts/build-libbox.sh

      - name: Generate Xcode project
        run: bash scripts/generate-project.sh

      - name: Build unsigned IPA
        run: bash scripts/build-ipa.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TurboBeeVPN-unsigned-ipa
          path: TurboBeeVPN-iOS/build/TurboBeeVPN-unsigned.ipa

      - name: Publish IPA to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes || true
          gh release create latest-build build/TurboBeeVPN-unsigned.ipa \
            --title "Latest build" \
            --notes "Auto-built unsigned IPA. Sideload with Sideloadly/AltStore."