name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: TurboBeeVPN-iOS
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false

      - name: Build Libbox.xcframework
        run: bash scripts/build-libbox.sh

      - name: Generate Xcode project
        run: bash scripts/generate-project.sh

      - name: Build unsigned IPA
        run: bash scripts/build-ipa.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TurboBeeVPN-unsigned-ipa
          path: TurboBeeVPN-iOS/build/TurboBeeVPN-unsigned.ipa

      - name: Publish IPA to private repo
        env:
          GH_TOKEN: ${{ secrets.IOS_RELEASE_TOKEN }}
        run: |
          if ! gh release view latest-build --repo whisa777/TurboBeeVPN-ios >/dev/null 2>&1; then
            gh release create latest-build build/TurboBeeVPN-unsigned.ipa \
              --repo whisa777/TurboBeeVPN-ios \
              --title "Latest build" \
              --notes "Private unsigned IPA. Sideload with Sideloadly/AltStore."
          else
            gh release upload latest-build build/TurboBeeVPN-unsigned.ipa --repo whisa777/TurboBeeVPN-ios --clobber
          fi