name: TurboBeeVPN
options:
  bundleIdPrefix: com.turbobee.vpn.ios
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    ENABLE_BITCODE: "NO"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
targets:
  TurboBeeVPN:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: TurboBeeVPN
    resources:
      - path: TurboBeeVPN/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.turbobee.vpn.ios
        PRODUCT_NAME: TurboBeeVPN
        INFOPLIST_FILE: TurboBeeVPN/Info.plist
        CODE_SIGN_ENTITLEMENTS: TurboBeeVPN/TurboBeeVPN.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
    dependencies:
      - target: PacketTunnel
        embed: true
  PacketTunnel:
    type: app-extension
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: PacketTunnel
        excludes:
          - Resources
    resources:
      - path: PacketTunnel/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.turbobee.vpn.ios.PacketTunnel
        PRODUCT_NAME: PacketTunnel
        INFOPLIST_FILE: PacketTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        APPLICATION_EXTENSION_API_ONLY: "YES"
        SKIP_INSTALL: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        GENERATE_INFOPLIST_FILE: "NO"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    dependencies:
      - framework: Frameworks/Libbox.xcframework
        embed: false
schemes:
  TurboBeeVPN:
    build:
      targets:
        TurboBeeVPN: all
        PacketTunnel: all
    run:
      config: Debug
    archive:
      config: Release
