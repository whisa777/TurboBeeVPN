workflows:
  build-ios:
    name: Build unsigned IPA (Codemagic)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      go: stable
      xcode: latest
    scripts:
      - name: Build Libbox.xcframework
        script: bash scripts/build-libbox.sh
      - name: Generate Xcode project
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Build unsigned IPA
        script: bash scripts/build-ipa.sh
    artifacts:
      - build/TurboBeeVPN-unsigned.ipa
